<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1117"><link rel="manifest" href="./manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>Api – Training Dashboard</title>
<style>
:root{--bg:#0d1117;--card:#151b23;--card2:#1b2330;--text:#eef2f7;--muted:#94a3b8;--line:#2a3442;--accent:#7dd3fc;--good:#86efac;--warn:#fde68a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}
h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.metric{font-size:25px;font-weight:750}.label{color:var(--muted);font-size:13px;margin-bottom:7px}
section{margin:18px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h2{font-size:19px;margin:0}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:12px;font-weight:600}.table td{font-size:14px}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--card2);font-size:12px}.good{color:var(--good)}.warn{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}button.primary{background:var(--accent);color:#08202b;border-color:var(--accent);font-weight:700}
form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1.3fr .8fr repeat(3,1fr);gap:8px;align-items:center}.row.head{color:var(--muted);font-size:12px}.row input{width:100%;background:#0f151d;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
.note{color:var(--muted);font-size:12px;line-height:1.5}.history{display:grid;gap:10px}.hist{display:flex;justify-content:space-between;gap:15px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1.2fr .7fr repeat(3,1fr);font-size:12px}.wrap{padding:14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1.2fr .65fr repeat(3,1fr);gap:4px}.row input{padding:7px 4px}.table{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🏋️ Training Dashboard</h1><div class="sub">Dein persönliches Trainingstagebuch</div></div>
    <div class="actions"><button onclick="resetData()">Daten zurücksetzen</button></div>
  </div>

  <div class="grid" id="metrics"></div>

  <section class="card">
    <div class="sectionhead"><h2>Aktueller Trainingsstand</h2><span class="pill">letztes Training: 07.10.2026</span></div>
    <table class="table"><thead><tr><th>#</th><th>Übung</th><th>Gewicht</th><th>Letztes Ergebnis</th><th>Hinweis</th></tr></thead>
    <tbody id="current"></tbody></table>
  </section>

  <section class="card">
    <div class="sectionhead"><h2>Neues Training eintragen</h2><span class="note">Format: Gewicht optional ändern, danach Wiederholungen</span></div>
    <form id="trainingForm">
      <div class="row head"><div>Übung</div><div>Gewicht</div><div>S1</div><div>S2</div><div>S3</div></div>
      <div id="formRows"></div>
      <div class="actions"><button class="primary" type="submit">Training speichern</button></div>
    </form>
  </section>

  <section class="card">
    <div class="sectionhead"><h2>Trainingshistorie</h2></div>
    <div class="history" id="history"></div>
  </section>

  <section class="card">
    <div class="sectionhead"><h2>🎯 Klimmzug-Fokus</h2></div>
    <div id="pullup"></div>
  </section>
</div>

<script>
const exercises=[
 {id:1,name:"Assistierte Klimmzüge",weight:32,unit:"kg Unterstützung",target:"8–10"},
 {id:2,name:"Latzug schulterbreit",weight:55,unit:"kg",target:"8–12"},
 {id:3,name:"T-Bar-Rudern",weight:25,unit:"kg",target:"8–12"},
 {id:4,name:"Bankdrücken",weight:20,unit:"kg",target:"8–12"},
 {id:5,name:"Beinpresse",weight:91,unit:"kg",target:"10–15"},
 {id:6,name:"Schulterpresse",weight:34,unit:"kg",target:"8–12"},
 {id:7,name:"Beinheben",weight:0,unit:"Körpergewicht",target:"8–12"},
 {id:8,name:"Bird Dog",weight:0,unit:"Körpergewicht",target:"8–10"}
];

const seed=[
 {date:"30.09.2026",sets:{
 1:{w:32,r:[8,9,8]},2:{w:55,r:[10,10,9]},3:{w:25,r:[11,10,9]},
 4:{w:20,r:[12,11,9]},5:{w:87,r:[15,12]},6:{w:32,r:[]},7:{w:0,r:[]},8:{w:0,r:[]}}},
 {date:"04.10.2026",sets:{
 1:{w:32,r:[8,9,9]},2:{w:55,r:[10,11,12]},3:{w:25,r:[12,11,9]},
 4:{w:20,r:[12,11,9]},5:{w:87,r:[15,15,15]},6:{w:32,r:[12,12]},7:{w:0,r:[11,11,8]},8:{w:0,r:[]}}},
 {date:"07.10.2026",sets:{
 1:{w:32,r:[8,8,8]},2:{w:60,r:[8,8]},3:{w:25,r:[12,12]},
 4:{w:20,r:[12,12,9]},5:{w:91,r:[15,15]},6:{w:34,r:[10,8]},7:{w:0,r:[12,10]},8:{w:0,r:[]}}}
];

let sessions=JSON.parse(localStorage.getItem("fitnessSessions")||"null")||seed;
function save(){localStorage.setItem("fitnessSessions",JSON.stringify(sessions));render();}
function lastFor(id){for(let i=sessions.length-1;i>=0;i--)if(sessions[i].sets[id]?.r?.length)return sessions[i].sets[id];return null}
function totalReps(){return sessions.reduce((a,s)=>a+Object.values(s.sets).reduce((b,x)=>b+(x.r||[]).reduce((c,n)=>c+n,0),0),0)}
function volume(){
 return sessions.reduce((a,s)=>a+Object.values(s.sets).reduce((b,x)=>b+(x.r||[]).reduce((c,n)=>c+n,0)*(x.w||0),0),0)
}
function render(){
 document.getElementById("metrics").innerHTML=`
 <div class="card"><div class="label">Trainingseinheiten</div><div class="metric">${sessions.length}</div></div>
 <div class="card"><div class="label">Wiederholungen</div><div class="metric">${totalReps()}</div></div>
 <div class="card"><div class="label">Letztes Training</div><div class="metric">${sessions[sessions.length-1]?.date||"–"}</div></div>
 <div class="card"><div class="label">Volumen*</div><div class="metric">${volume().toLocaleString("de-DE")} kg</div></div>`;
 document.getElementById("current").innerHTML=exercises.map(e=>{
   const x=lastFor(e.id), reps=x?.r?.join(" / ")||"–";
   let note="–";
   if(x?.r?.length){
     const max=x.r.length?Math.max(...x.r):0;
     if(e.id===1) note=max>=9?"Weiter bei 32 kg":"32 kg halten";
     else if(max>=parseInt(e.target.split("–")[1])) note='<span class="good">Steigerung prüfen</span>';
     else note="Gewicht halten";
   }
   return `<tr><td><b>${e.id}</b></td><td>${e.name}</td><td>${x?x.w:e.weight}${e.weight?` ${e.unit}`:""}</td><td>${reps}</td><td>${note}</td></tr>`;
 }).join("");
 document.getElementById("formRows").innerHTML=exercises.map(e=>`
   <div class="row"><div><b>${e.id}.</b> ${e.name}</div>
   <div><input type="number" step="0.5" name="w${e.id}" placeholder="${e.weight||"KG"}" ${e.weight?`value="${e.weight}"`:""}></div>
   <div><input type="number" min="0" name="r${e.id}_1"></div>
   <div><input type="number" min="0" name="r${e.id}_2"></div>
   <div><input type="number" min="0" name="r${e.id}_3"></div></div>`).join("");
 document.getElementById("history").innerHTML=[...sessions].reverse().map(s=>{
   const reps=Object.values(s.sets).reduce((a,x)=>a+(x.r||[]).reduce((b,n)=>b+n,0),0);
   return `<div class="hist"><div><b>${s.date}</b><div class="note">${Object.entries(s.sets).filter(([_,x])=>x.r?.length).length} Übungen absolviert</div></div><span class="pill">${reps} Wdh.</span></div>`;
 }).join("");
 const p=sessions.map(s=>s.sets[1]).filter(x=>x?.r?.length);
 const first=p[0], last=p[p.length-1];
 document.getElementById("pullup").innerHTML=last?`
   <div class="metric">${last.w} kg Unterstützung · ${last.r.join(" / ")}</div>
   <p class="note">Dein Ausgangspunkt im aktuellen Dashboard: 32 kg Unterstützung. Ziel ist, die Unterstützung schrittweise zu reduzieren, während die Wiederholungen sauber bleiben.</p>`:"Noch keine Daten.";
}
document.getElementById("trainingForm").addEventListener("submit",e=>{
 e.preventDefault();const f=new FormData(e.target),sets={};
 exercises.forEach(x=>{
   const r=[1,2,3].map(n=>Number(f.get(`r${x.id}_${n}`)||0)).filter(n=>n>0);
   if(r.length)sets[x.id]={w:Number(f.get(`w${x.id}`)||x.weight)||0,r};
 });
 if(!Object.keys(sets).length)return alert("Bitte mindestens eine Übung eintragen.");
 const d=new Date();const date=d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
 sessions.push({date,sets});save();e.target.reset();window.scrollTo({top:0,behavior:"smooth"});
});
function resetData(){if(confirm("Alle gespeicherten Dashboard-Daten löschen und die Beispieldaten wiederherstellen?")){localStorage.removeItem("fitnessSessions");sessions=seed;render();}}
render();
</script>
<script>window.addEventListener("load",()=>{if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(console.error);});</script></body></html>
